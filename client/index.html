<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumiere</title>
  <link rel="stylesheet" href="/client/style.css" />
</head>
<body>
  <div class="stage">
    <header class="bar">
      <div class="brand">
        <span class="dot" id="statusDot"></span>
        <span class="name">Lumiere</span>
      </div>
      <div class="controls">
        <button id="connectBtn" class="btn primary">Connect mic</button>
        <span id="status" class="status">idle</span>
      </div>
    </header>

    <main class="player">
      <video id="video" playsinline></video>
      <div id="nowPlaying" class="now-playing">No video loaded</div>
      <div class="vcontrols" id="vcontrols" role="group" aria-label="Playback controls">
        <button class="vbtn" id="prevBtn" title="Previous" aria-label="Previous">⏮</button>
        <button class="vbtn" id="playPauseBtn" title="Play / Pause" aria-label="Play or pause">⏸</button>
        <button class="vbtn" id="nextBtn" title="Next" aria-label="Next">⏭</button>
        <button class="vbtn" id="restartBtn" title="Restart" aria-label="Restart">↻</button>
      </div>
    </main>

    <aside class="playlist">
      <h2>Videos</h2>
      <ul id="playlist"></ul>
      <p class="hint">Say: "Lumiere, play the intro", "pause", "next one", "go back to the intro".</p>
    </aside>
  </div>

  <script type="module" src="/client/app.js"></script>
</body>
</html>
